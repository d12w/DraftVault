name: Assemble DraftVault 0.3.1 package

on:
  push:
    branches: [main]
    paths:
      - ".release-upload/0.3.1/**"
      - ".github/workflows/assemble-draftvault.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .release-upload/0.3.1/part-*.b64 | base64 --decode > DraftVault-0.3.1-beta.zip
          unzip -t DraftVault-0.3.1-beta.zip
          echo "Archive SHA-256:"
          sha256sum DraftVault-0.3.1-beta.zip
          echo "db8bac2593dbe05692d83daf5a176332964cd7be2d264ad8935f50474aa2dd3b  DraftVault-0.3.1-beta.zip" | sha256sum --check
          rm -f DraftVault-0.1.0-beta.zip
          rm -rf .release-upload
          rm -f .github/workflows/assemble-draftvault.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish DraftVault 0.3.1 beta"
          git push origin HEAD:main
